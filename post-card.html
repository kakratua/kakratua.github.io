<article class="post-card" data-tags="{{ post.tags | join: ' ' | downcase }}">
  <a class="post-card-link" href="{{ post.url | relative_url }}">
    <div class="post-meta"><time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: '%d.%m.%Y' }}</time><span>{{ post.reading_time | default: 'อ่าน 4 นาที' }}</span></div>
    <h3>{{ post.title }}</h3>
    <p>{{ post.excerpt | strip_html | truncate: 155 }}</p>
    <div class="tags">{% for tag in post.tags %}<span>#{{ tag }}</span>{% endfor %}</div>
  </a>
</article>
